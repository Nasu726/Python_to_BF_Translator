name: profile-abc199-source

on:
  pull_request:
  workflow_dispatch:

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'global-bf-redundancy-profiler'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile ordinary ABC199 C source attribution
        env:
          PYTHONPATH: pybf
        run: python tools/profile_abc199_source.py

      - name: Profile emitted BF globally (Issue 10)
        env:
          PYTHONPATH: pybf:tools
        run: python -m bfglobalprofile --abc199 --top 15

      - name: Profile near-linear scaling (synthetic BF, no source rewrites)
        env:
          PYTHONPATH: pybf
        run: |
          python - <<'PY'
          from bfglobalprofile import analyze
          from time import perf_counter
          import resource
          for repeats in (11000, 90000, 180000, 350000):
              src = '[->+<]' * repeats
              start = perf_counter()
              report = analyze(src, top=1)
              seconds = perf_counter() - start
              rss_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
              assert report['bf_bytes'] == len(src)
              print(f"bf_bytes={len(src)} seconds={seconds:.4f} maxrss_kb={rss_kb}")
          PY
