name: test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: arithmetic
            files: >-
              tests/test_bfarith.py
              tests/test_bfbase4.py
              tests/test_bfbase4decimal.py
              tests/test_bfcompare.py
              tests/test_bfcore.py
              tests/test_bfio.py
              tests/test_bfquad.py
              tests/test_bfsigned.py
              tests/test_bfwordops.py
          - suite: runtime
            files: >-
              tests/test_bfcontestpartition.py
              tests/test_bfdynlist.py
              tests/test_bfheap.py
              tests/test_bfhexcounted.py
              tests/test_bfhexpartition.py
              tests/test_bfhexpartition_movefused.py
              tests/test_bfhexpasses.py
              tests/test_bfhexseq.py
              tests/test_bflists.py
              tests/test_bfmemory.py
              tests/test_bfobjects.py
              tests/test_bfpacked.py
              tests/test_bfpacked64.py
              tests/test_bfpackedseq.py
              tests/test_bfstreamseq.py
              tests/test_bfstrings.py
              tests/test_bftokens.py
          - suite: frontend
            files: >-
              tests/test_controlflow.py
              tests/test_input_lines.py
              tests/test_split_input.py
              tests/test_string_iteration.py
              tests/test_transpiler_current.py
              tests/test_transpiler_lists.py
              tests/test_transpiler_v2.py
              tests/test_transpiler_v3.py
          - suite: contest
            files: >-
              tests/test_abc_c_foundation.py
              tests/test_code_size.py
              tests/test_compile_performance.py
              tests/test_compiler_partition.py
              tests/test_layout_plan.py
              tests/test_public_api.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest pytest-xdist
      - name: Run ${{ matrix.suite }} tests
        # Separate matrix entries get separate hosted runners.  Two xdist
        # workers inside each runner use its CPU without the over-subscription
        # caused by a single `-n auto` job.
        run: python -m pytest -q -n 2 --dist=worksteal --durations=10 ${{ matrix.files }}
      - name: Report scalable partition metrics
        if: matrix.suite == 'runtime'
        env:
          PYTHONPATH: pybf
        run: |
          python - <<'PY'
          from bf_runtime import run_bf
          from bfcontestpartition import build_partition_program, partition_program_size_breakdown
          from bfcore import BFEmitter
          from bfhexcounted import read_counted_two_line_s64s_and_sum
          from bfhexio import print_record_hex_s64_compact, propagate_field_back_after_consumed_markers
          from bfhexpartition import run_partition_min_pass
          from bfhexpartition_movefused import run_partition_min_pass as run_movefused_partition_min_pass
          from bfhexseq import ANS, RuntimeHexIntSequence
          from bfopt import optimize_bf

          code = build_partition_program()
          print(f"partition_source_bytes={len(code)}")
          print(f"partition_size_breakdown={partition_program_size_breakdown()}")

          measured = {}
          for n in (32, 64):
              data = f"{n}\n" + " ".join(["1"] * n) + "\n"
              result = run_bf(code, data, memory_size=30000, step_limit=1000000000)
              measured[n] = result.steps
              print(f"partition_steps_n{n}={result.steps}")
          slope = (measured[64] - measured[32]) / 32
          projected = measured[64] + slope * (200000 - 64)
          print(f"partition_steps_per_added_record={slope:.1f}")
          print(f"partition_raw_step_projection_n200000={projected:.0f}")

          def stage_program(stage, partition_runner=run_partition_min_pass):
              bf = BFEmitter()
              seq = RuntimeHexIntSequence(base=320)
              read_counted_two_line_s64s_and_sum(bf, seq)
              if stage == "read":
                  return optimize_bf(bf.code())
              seq.propagate_total_back_to_first(bf)
              if stage == "reverse_total":
                  return optimize_bf(bf.code())
              partition_runner(bf, seq, initial_ans=10000000)
              if stage == "partition":
                  return optimize_bf(bf.code())
              propagate_field_back_after_consumed_markers(bf, seq, ANS)
              if stage == "reverse_ans":
                  return optimize_bf(bf.code())
              print_record_hex_s64_compact(bf, seq, field_base=ANS)
              return optimize_bf(bf.code())

          n = 64
          data = f"{n}\n" + " ".join(["1"] * n) + "\n"
          for stage in ("read", "reverse_total", "partition", "reverse_ans", "full"):
              stage_code = stage_program(stage)
              result = run_bf(
                  stage_code,
                  data,
                  memory_size=30000,
                  step_limit=1000000000,
              )
              print(f"partition_phase_{stage}_source={len(stage_code)} steps={result.steps}")

          movefused_code = stage_program("partition", run_movefused_partition_min_pass)
          movefused_result = run_bf(
              movefused_code,
              data,
              memory_size=30000,
              step_limit=1000000000,
          )
          print(
              f"partition_phase_movefused_source={len(movefused_code)} "
              f"steps={movefused_result.steps}"
          )

          # Compare the N-counted reader against the underlying line reader to
          # separate numeric parsing/summing cost from count-carry overhead.
          bf = BFEmitter()
          seq = RuntimeHexIntSequence(base=320)
          seq.read_lf_terminated_s64s_and_sum(bf)
          line_code = optimize_bf(bf.code())
          line_data = " ".join(["1"] * 64) + "\n"
          line_result = run_bf(
              line_code,
              line_data,
              memory_size=30000,
              step_limit=1000000000,
          )
          print(f"partition_plain_line_reader_source={len(line_code)} steps_n64={line_result.steps}")
          PY
