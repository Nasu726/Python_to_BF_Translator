name: test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest pytest-xdist
      - name: Run tests in parallel
        # BF execution tests are CPU/memory heavy.  A fixed worker count avoids
        # oversubscribing hosted runners while still parallelizing independent
        # generated-program executions.
        run: python -m pytest -q -n 4 --dist=worksteal --durations=20
