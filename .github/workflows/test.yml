name: test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: arithmetic
            files: >-
              tests/test_bfarith.py
              tests/test_bfbase4.py
              tests/test_bfbase4decimal.py
              tests/test_bfcompare.py
              tests/test_bfcore.py
              tests/test_bfio.py
              tests/test_bfquad.py
              tests/test_bfsigned.py
              tests/test_bfwordops.py
          - suite: runtime
            files: >-
              tests/test_bfcontestpartition.py
              tests/test_bfdynlist.py
              tests/test_bfheap.py
              tests/test_bfhexcounted.py
              tests/test_bfhexcounted_extent.py
              tests/test_bfhexcounted_direct.py
              tests/test_bfhexcounted_lexfast.py
              tests/test_bfhexdecimal.py
              tests/test_bfhexdecimal_compact.py
              tests/test_bfhexpartition.py
              tests/test_bfhexpartition_movefused.py
              tests/test_bfhexpartition_minfused.py
              tests/test_bfhexpartition_totalcandidate.py
              tests/test_bfhexpartition_addcandidate.py
              tests/test_bfhexpartition_nonnegans.py
              tests/test_bfhexpartition_boundedans.py
              tests/test_bfhexpartition_adaptiveans.py
              tests/test_bfhexpartition_zeroans.py
              tests/test_bfhexpartition_prefix.py
              tests/test_bfhexpartition_prefix_terminal.py
              tests/test_bfhexpartition_absfast.py
              tests/test_bfhexradixfast.py
              tests/test_bfhexpasses.py
              tests/test_bfhexseq.py
              tests/test_bfhexseq_direct.py
              tests/test_bflists.py
              tests/test_bfmemory.py
              tests/test_bfobjects.py
              tests/test_bfpacked.py
              tests/test_bfpacked64.py
              tests/test_bfpackedseq.py
              tests/test_bfstreamseq.py
              tests/test_bfstrings.py
              tests/test_bftokens.py
          - suite: frontend
            files: >-
              tests/test_charlist_conversions.py
              tests/test_decimalconv.py
              tests/test_streaming_int_list.py
              tests/test_controlflow.py
              tests/test_input_lines.py
              tests/test_split_input.py
              tests/test_string_iteration.py
              tests/test_transpiler_current.py
              tests/test_transpiler_lists.py
              tests/test_transpiler_v2.py
              tests/test_transpiler_v3.py
          - suite: contest
            files: >-
              tests/test_abc_c_foundation.py
              tests/test_code_size.py
              tests/test_compile_performance.py
              tests/test_compiler_partition.py
              tests/test_layout_plan.py
              tests/test_public_api.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest pytest-xdist
      - name: Verify full test collection
        if: matrix.suite == 'contest'
        run: python -m pytest --collect-only -q tests
      - name: Run ${{ matrix.suite }} tests
        run: python -m pytest -q -n 2 --dist=worksteal --durations=10 ${{ matrix.files }}
      - name: Report scalable partition metrics
        if: matrix.suite == 'runtime'
        env:
          PYTHONPATH: pybf
        run: |
          python - <<'PY'
          from bf_runtime import run_bf
          from bfcontestpartition import build_partition_program, partition_program_size_breakdown
          from bfcore import BFEmitter
          from bfhexcounted_prefix import read_counted_two_line_s64s_and_sum
          from bfhexcandidate_prefix import move_total_minus_double_prefix_into_total
          from bfhexpartition_prefix import run_partition_min_pass
          from bfhexpartition_totalcandidate import _abs_total_inplace
          from bfhexseq import BACK, MARKER, RECORD_STRIDE, RuntimeHexIntSequence, _RelativeBuilder
          from bfopt import optimize_bf

          code = build_partition_program()
          print(f"partition_source_bytes={len(code)}")
          print(f"partition_size_breakdown={partition_program_size_breakdown()}")

          measured = {}
          for n in (32, 64):
              data = f"{n}\n" + " ".join(["1"] * n) + "\n"
              result = run_bf(code, data, memory_size=30000, step_limit=1000000000)
              measured[n] = result.steps
              print(f"partition_steps_n{n}={result.steps}")
          slope = (measured[64] - measured[32]) / 32
          projected = measured[64] + slope * (200000 - 64)
          print(f"partition_steps_per_added_record={slope:.1f}")
          print(f"partition_raw_step_projection_n200000={projected:.0f}")

          n = 64
          data = f"{n}\n" + " ".join(["1"] * n) + "\n"

          bf = BFEmitter()
          seq = RuntimeHexIntSequence(base=320)
          read_counted_two_line_s64s_and_sum(bf, seq)
          reader_code = optimize_bf(bf.code())
          reader_result = run_bf(reader_code, data, memory_size=30000, step_limit=1000000000)
          print(f"partition_prefix_reader_source={len(reader_code)} steps_n64={reader_result.steps}")

          seq.propagate_total_back_to_first(bf)
          reverse_code = optimize_bf(bf.code())
          reverse_result = run_bf(reverse_code, data, memory_size=30000, step_limit=1000000000)
          print(f"partition_reverse_total_source={len(reverse_code)} steps_n64={reverse_result.steps}")

          run_partition_min_pass(bf, seq, initial_ans=10_000_000)
          reusable_partition_code = optimize_bf(bf.code())
          reusable_partition_result = run_bf(
              reusable_partition_code,
              data,
              memory_size=30000,
              step_limit=1000000000,
          )
          print(
              f"partition_reusable_pass_source={len(reusable_partition_code)} "
              f"steps_n64={reusable_partition_result.steps}"
          )

          def partial_partition(include_abs):
              local = BFEmitter()
              local_seq = RuntimeHexIntSequence(base=320)
              read_counted_two_line_s64s_and_sum(local, local_seq)
              local_seq.propagate_total_back_to_first(local)
              r = _RelativeBuilder()
              move_total_minus_double_prefix_into_total(r)
              if include_abs:
                  _abs_total_inplace(r)
              r.move(RECORD_STRIDE + MARKER)
              local.move(local_seq.base + MARKER)
              local.emit("[" + r.code() + "]")
              local.emit(">" * BACK)
              local.emit("[" + "<" * RECORD_STRIDE + "]")
              local.emit("<" * BACK)
              local.ptr = local_seq.base
              return optimize_bf(local.code())

          for label, include_abs in (("candidate_only", False), ("candidate_abs", True)):
              partial_code = partial_partition(include_abs)
              partial_result = run_bf(partial_code, data, memory_size=30000, step_limit=1000000000)
              print(f"partition_{label}_source={len(partial_code)} steps_n64={partial_result.steps}")
          PY
