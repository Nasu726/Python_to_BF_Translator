name: dynamic-list-linear

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dynamic-list-linear-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  streaming-int-list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Run streaming int-list tests
        run: python -m pytest -q --durations=10 tests/test_streaming_int_list.py
      - name: Run existing frontend regressions
        run: >-
          python -m pytest -q
          tests/test_controlflow.py
          tests/test_input_lines.py
          tests/test_split_input.py
          tests/test_string_iteration.py
          tests/test_transpiler_current.py
          tests/test_transpiler_lists.py
